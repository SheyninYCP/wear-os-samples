name: Build Watch Face
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WatchFaceFormat/Complications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: watchface-debug-apk
          path: watchface/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: watchface-release-aab
          path: watchface/build/outputs/bundle/release/*.aab
